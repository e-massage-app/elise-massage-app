<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aperçu Calendrier (données fictives)</title>
  <!-- Outil de developpement : le calendrier, ses jours fermes et la fenetre « Reglages du
       calendrier », avec des donnees FICTIVES en memoire. Aucune connexion a Supabase.
       Ouvrir via le serveur local (elise-pwa-fichiers). -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/views.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <style>.app-container { opacity: 1; } .bandeau { background: #333; color: #fff; padding: .4rem 1rem; font: 12px Inter, sans-serif; }</style>
</head>
<body class="loaded">
  <div class="bandeau">Aperçu avec des données fictives — rien n'est enregistré</div>
  <div class="app-container">
    <main class="main-content">
      <div id="calendrier" class="tab-content active">
        <div class="calendar-header">
          <h2>Calendrier des rendez-vous</h2>
          <div class="calendar-controls">
            <button onclick="previousMonth()">&lt;</button>
            <span id="current-month-year"></span>
            <button onclick="nextMonth()">&gt;</button>
            <button class="btn-primary">Nouveau RDV</button>
            <button class="btn-secondary">Export .ics</button>
            <button class="cal-picto" onclick="CalendrierReglages.ouvrir()" title="Réglages du calendrier" aria-label="Réglages du calendrier">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
                <circle cx="9" cy="6" r="2.2" fill="var(--white)"/><circle cx="15" cy="12" r="2.2" fill="var(--white)"/><circle cx="8" cy="18" r="2.2" fill="var(--white)"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </div>
    </main>
  </div>
  <div id="modal-overlay" class="modal-overlay"></div>

  <script>
  // ----- Donnees fictives : quelques RDV ce mois-ci, dont un un lundi (jour ferme) -----
  const auj = new Date();
  const ym = `${auj.getFullYear()}-${String(auj.getMonth() + 1).padStart(2, '0')}`;
  const jourDuMois = (j) => `${ym}-${String(j).padStart(2, '0')}`;
  const lundi = (() => { for (let j = 1; j <= 7; j++) { if (new Date(auj.getFullYear(), auj.getMonth(), j).getDay() === 1) return j; } })();
  const rdv = [
    { id: 'r1', clientId: 'c1', date: jourDuMois(lundi), heure: '10:00', type: 'Massage', duree: 60, statut: 'confirmé' },
    { id: 'r2', clientId: 'c2', date: jourDuMois(lundi + 2), heure: '14:00', type: 'HeadSpa', duree: 45, statut: 'confirmé' },
    { id: 'r3', clientId: 'c1', date: jourDuMois(lundi + 4), heure: '09:30', type: 'Massage', duree: 90, statut: 'confirmé' }
  ];
  const appData = { rdv, prestations: [], clients: [{ id: 'c1', prenom: 'Cliente', nom: 'Fictive' }, { id: 'c2', prenom: 'Autre', nom: 'Cliente' }], parametres: {} };
  window.DataManager = {
    getAppData: () => appData,
    getParametres: () => appData.parametres,
    getRdvForDate: (d) => appData.rdv.filter(r => r.date === d),
    getPrestationsForDate: () => [],
    isJourInstitut: () => false,
    getCalendarColorForSoin: () => null,
    isPartnershipSoin: () => false,
    saveParametresCles: async (cles) => { console.log('Aperçu : enregistré (en mémoire)', cles, JSON.stringify(appData.parametres.calendrier)); return true; }
  };
  window.FormManager = { selectCalendarDay: (d) => console.log('Jour touché :', d), showRdvDetails: () => {} };
  window.getDisplayNameForCalendar = (rdv, client) => client ? client.prenom : 'Cliente';
  </script>
  <script src="../js/core/encaissements.js"></script>
  <script src="../js/core/rdv-prestations.js"></script>
  <script src="../js/core/calculations.js"></script>
  <script src="../js/ui/view-manager.js"></script>
  <script src="../js/ui/modal-manager.js"></script>
  <script src="../js/ui/calendrier-reglages.js"></script>
  <script>
  window.ViewManager.updateCalendar();
  </script>
</body>
</html>
